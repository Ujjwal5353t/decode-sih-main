# VidyaSetu - Render Infrastructure as Code (Blueprint)
# Multi-Service Architecture for "Best Use of Render Track"

services:
  # ----------------------------------------------------------------------------
  # 1. Frontend Web Service (Next.js 16)
  # ----------------------------------------------------------------------------
  - type: web
    name: vidyasetu-frontend
    env: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: vidyasetu-backend
          property: url

  # ----------------------------------------------------------------------------
  # 2. Backend Web Service (FastAPI + SQLModel)
  # ----------------------------------------------------------------------------
  - type: web
    name: vidyasetu-backend
    env: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install uv && uv sync && uv run python -m src.db.seed
    startCommand: uv run uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vidyasetu-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin003@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_NAME
        value: education-ai
      - key: DEBUG
        value: "false"

  # ----------------------------------------------------------------------------
  # 3. AI / OCR Background Worker (Python Process)
  # ----------------------------------------------------------------------------
  - type: worker
    name: vidyasetu-ai-worker
    env: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install uv && uv sync
    startCommand: uv run python -m src.services.worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vidyasetu-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: vidyasetu-backend
          property: envVars.SECRET_KEY
      - key: GEMINI_API_KEY
        fromService:
          type: web
          name: vidyasetu-backend
          property: envVars.GEMINI_API_KEY
      - key: CLOUDINARY_CLOUD_NAME
        fromService:
          type: web
          name: vidyasetu-backend
          property: envVars.CLOUDINARY_CLOUD_NAME
      - key: CLOUDINARY_API_KEY
        fromService:
          type: web
          name: vidyasetu-backend
          property: envVars.CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET
        fromService:
          type: web
          name: vidyasetu-backend
          property: envVars.CLOUDINARY_API_SECRET

  # ----------------------------------------------------------------------------
  # 4. Scheduled Cron Job (Daily Progress Digest & Cleanup)
  # ----------------------------------------------------------------------------
  - type: cron
    name: vidyasetu-daily-digest
    env: python
    plan: free
    region: singapore
    rootDir: backend
    schedule: "0 0 * * *"
    buildCommand: pip install uv && uv sync
    startCommand: uv run python -m src.services.daily_digest
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vidyasetu-db
          property: connectionString

# ------------------------------------------------------------------------------
# 5. Managed PostgreSQL Database
# ------------------------------------------------------------------------------
databases:
  - name: vidyasetu-db
    plan: free
    region: singapore
    databaseName: vidyasetu
    user: vidyasetu_user
