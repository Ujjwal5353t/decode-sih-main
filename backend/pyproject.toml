[project]
name = "backend"
version = "0.1.0"
description = "Decode SIH — Inclusive Education AI Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "sqlmodel>=0.0.22",
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2.0,<4.0.0",
    "python-multipart>=0.0.20",
    "cloudinary>=1.44.0",
    "pillow>=11.3.0",
    "img2pdf>=0.5.1",
    "pydantic-settings>=2.7.0",
    "greenlet>=3.1.0",
    "email-validator>=2.2.0",
    "easyocr>=1.7.2",
    "fpdf2>=2.8.8",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
